<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도시 날씨 검색</title>
  <style>
    :root {
      --bg: #eef3f8;
      --card: #ffffff;
      --text: #1d2733;
      --muted: #6b7785;
      --accent: #2f7de1;
      --border: #d5dde6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111820;
        --card: #1b2530;
        --text: #e8eef5;
        --muted: #9aa7b5;
        --accent: #5aa2ff;
        --border: #2b3947;
      }
    }
    :root[data-theme="dark"] {
      --bg: #111820;
      --card: #1b2530;
      --text: #e8eef5;
      --muted: #9aa7b5;
      --accent: #5aa2ff;
      --border: #2b3947;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    main {
      width: 100%;
      max-width: 480px;
      padding-top: 32px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 16px; text-align: center; }
    form { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
    }
    button {
      padding: 12px 18px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .results { list-style: none; padding: 0; margin: 12px 0 0; }
    .results li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .results button {
      width: 100%;
      text-align: left;
      background: none;
      color: var(--text);
      padding: 12px 14px;
    }
    .results button:hover { background: var(--bg); }
    .results small { color: var(--muted); }
    .status { text-align: center; color: var(--muted); margin: 16px 0; min-height: 1.2em; }
    .error { color: #d64545; }
    .weather {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-top: 16px;
      text-align: center;
    }
    .weather .city { font-size: 1.3rem; font-weight: 600; }
    .weather .place { color: var(--muted); font-size: .9rem; margin-top: 2px; }
    .weather .icon { font-size: 4rem; margin: 12px 0 4px; }
    .weather .temp { font-size: 3.2rem; font-weight: 700; }
    .weather .desc { font-size: 1.1rem; margin-top: 4px; }
    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
    }
    .details div {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 4px;
      font-size: .85rem;
      color: var(--muted);
    }
    .details strong { display: block; color: var(--text); font-size: 1rem; margin-top: 4px; }
    .time { color: var(--muted); font-size: .8rem; margin-top: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>도시 날씨 검색</h1>
    <form id="search-form">
      <input type="text" id="city" placeholder="도시 이름 (예: Seoul, 부산, Tokyo)" autocomplete="off" required>
      <button type="submit" id="submit-btn">검색</button>
    </form>

    <ul id="results" class="results hidden"></ul>
    <div id="status" class="status"></div>

    <section id="weather" class="weather hidden">
      <div class="city" id="w-city"></div>
      <div class="place" id="w-place"></div>
      <div class="icon" id="w-icon"></div>
      <div class="temp" id="w-temp"></div>
      <div class="desc" id="w-desc"></div>
      <div class="details">
        <div>체감온도<strong id="w-feels"></strong></div>
        <div>습도<strong id="w-humidity"></strong></div>
        <div>풍속<strong id="w-wind"></strong></div>
      </div>
      <div class="time" id="w-time"></div>
    </section>
  </main>

  <script>
    const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
    const FORECAST_URL = "https://api.open-meteo.com/v1/forecast";

    // WMO weather interpretation codes used by Open-Meteo
    const WEATHER = {
      0: ["맑음", "☀️"],
      1: ["대체로 맑음", "🌤️"],
      2: ["구름 조금", "⛅"],
      3: ["흐림", "☁️"],
      45: ["안개", "🌫️"],
      48: ["짙은 안개", "🌫️"],
      51: ["약한 이슬비", "🌦️"],
      53: ["이슬비", "🌦️"],
      55: ["강한 이슬비", "🌦️"],
      56: ["약한 어는 이슬비", "🌧️"],
      57: ["강한 어는 이슬비", "🌧️"],
      61: ["약한 비", "🌦️"],
      63: ["비", "🌧️"],
      65: ["강한 비", "🌧️"],
      66: ["약한 어는 비", "🌧️"],
      67: ["강한 어는 비", "🌧️"],
      71: ["약한 눈", "🌨️"],
      73: ["눈", "🌨️"],
      75: ["강한 눈", "❄️"],
      77: ["싸락눈", "🌨️"],
      80: ["약한 소나기", "🌦️"],
      81: ["소나기", "🌧️"],
      82: ["강한 소나기", "⛈️"],
      85: ["약한 눈보라", "🌨️"],
      86: ["강한 눈보라", "❄️"],
      95: ["뇌우", "⛈️"],
      96: ["우박을 동반한 뇌우", "⛈️"],
      99: ["강한 우박 뇌우", "⛈️"]
    };

    const form = document.getElementById("search-form");
    const input = document.getElementById("city");
    const submitBtn = document.getElementById("submit-btn");
    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const weatherEl = document.getElementById("weather");

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    function clearResults() {
      resultsEl.innerHTML = "";
      resultsEl.classList.add("hidden");
    }

    function hideWeather() {
      weatherEl.classList.add("hidden");
    }

    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`요청 실패 (${res.status})`);
      return res.json();
    }

    async function searchCity(name) {
      const params = new URLSearchParams({ name, count: "5", language: "ko", format: "json" });
      const data = await fetchJson(`${GEO_URL}?${params}`);
      return data.results || [];
    }

    async function loadWeather(place) {
      setStatus("날씨를 불러오는 중...");
      hideWeather();
      try {
        const params = new URLSearchParams({
          latitude: place.latitude,
          longitude: place.longitude,
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m",
          timezone: "auto"
        });
        const data = await fetchJson(`${FORECAST_URL}?${params}`);
        const c = data.current;
        const [desc, icon] = WEATHER[c.weather_code] || ["알 수 없음", "❔"];

        document.getElementById("w-city").textContent = place.name;
        document.getElementById("w-place").textContent =
          [place.admin1, place.country].filter(Boolean).join(", ");
        document.getElementById("w-icon").textContent = icon;
        document.getElementById("w-temp").textContent = `${Math.round(c.temperature_2m)}°C`;
        document.getElementById("w-desc").textContent = desc;
        document.getElementById("w-feels").textContent = `${Math.round(c.apparent_temperature)}°C`;
        document.getElementById("w-humidity").textContent = `${c.relative_humidity_2m}%`;
        document.getElementById("w-wind").textContent = `${c.wind_speed_10m} km/h`;
        document.getElementById("w-time").textContent =
          `현지 관측 시각: ${c.time.replace("T", " ")} (${data.timezone_abbreviation || data.timezone})`;

        weatherEl.classList.remove("hidden");
        setStatus("");
      } catch (err) {
        setStatus(`날씨 정보를 가져오지 못했습니다. ${err.message}`, true);
      }
    }

    function showChoices(places) {
      resultsEl.innerHTML = "";
      places.forEach((p) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        const label = document.createElement("span");
        label.textContent = p.name;
        const small = document.createElement("small");
        small.textContent = " " + [p.admin1, p.country].filter(Boolean).join(", ");
        btn.append(label, small);
        btn.addEventListener("click", () => {
          clearResults();
          loadWeather(p);
        });
        li.appendChild(btn);
        resultsEl.appendChild(li);
      });
      resultsEl.classList.remove("hidden");
      setStatus("도시를 선택하세요.");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) return;

      submitBtn.disabled = true;
      clearResults();
      hideWeather();
      setStatus("도시를 검색하는 중...");

      try {
        const places = await searchCity(name);
        if (places.length === 0) {
          setStatus("검색 결과가 없습니다. 다른 이름으로 시도해 보세요.", true);
        } else if (places.length === 1) {
          await loadWeather(places[0]);
        } else {
          showChoices(places);
        }
      } catch (err) {
        setStatus(`검색에 실패했습니다. ${err.message}`, true);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
